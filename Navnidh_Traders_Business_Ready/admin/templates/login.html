<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login · Navnidh Traders</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static',filename='admin.css') }}" rel="stylesheet"></head><body class="login-page"><div class="login-card"><div class="login-logo">NT</div><div class="eyebrow">NAVNIDH TRADERS</div><h1>Admin Login</h1><p class="muted">Manage your store, orders and customers from one place.</p>{% for cat,m in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{cat}}">{{m}}</div>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ request.args.get('next','') }}"><label>Email</label><input class="form-control" type="email" name="email" required autocomplete="username"><label>Password</label><input class="form-control" type="password" name="password" required autocomplete="current-password"><button class="btn btn-dark w-100 mt-3">Sign in to Admin</button></form><div class="login-note">Only administrator accounts can enter this panel.</div></div></body></html>
