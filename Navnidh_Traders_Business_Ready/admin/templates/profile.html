{% extends 'base.html' %}{% block heading %}Admin profile{% endblock %}{% block body %}<section class="panel form-panel" style="max-width:760px"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name</label><input class="form-control mb-3" name="name" value="{{u.name}}" required><label>Email</label><input class="form-control mb-3" value="{{u.email}}" disabled><label>New password</label><input class="form-control mb-2" type="password" name="new_password" minlength="8" placeholder="Leave blank to keep current password"><small class="muted">Use at least 8 characters.</small><div class="form-actions"><button class="btn btn-dark">Save changes</button></div></form></section>{% endblock %}
